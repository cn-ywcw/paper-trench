<html lang="zh-CN">

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;

    -webkit-tap-highlight-color: transparent;
  }

    display: block; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
  }
</style>

<body>
<canvas id="game"></canvas>
<script>
(function () {
"use strict";

/* =========================================================================
   Paper Trench · 纸面战壕
   Single-file HTML5 + Canvas casual strategy game.
   Blue ink = you.  Red ink = the enemy.  Push the front, hold the line.
   ========================================================================= */

/* ----------------------------- constants ------------------------------- */
var cvs = document.getElementById("game");
var ctx = cvs.getContext("2d");

var FONT = '"Comic Sans MS","Segoe Print","Bradley Hand","Chalkboard SE","Comic Neue",cursive';

var C = {
  paper:      "#fdfcf5",
  gridMinor:  "rgba(122,160,212,0.30)",
  gridMajor:  "rgba(88,132,196,0.44)",
  blue:       "#17359c",
  blueDeep:   "#0e2270",
  blueMid:    "#3a5fc8",
  red:        "#c0272d",
  redDeep:    "#8b1a1f",
  redMid:     "#d9454a",
  ink:        "#16234c",
  tape:       "rgba(247,224,140,0.88)",
  tapeLine:   "rgba(203,172,80,0.85)",
  cardBg:     "#fffef8",
  grey:       "#9aa3b2"
};

var DURATION = 180;          // seconds per match
var HQ_HP    = 3000;
var HQ_REGEN = 14;           // hp/s once the HQ has been left alone for a moment
var HQ_RANGE = 195;          // the HQ watchtower's reach
var HQ_DPS   = 15;           // per shot
var HQ_RATE  = 0.42;         // seconds between shots
var PLAYER_REGEN = 1.05;     // ink per second. Raised twice, each time to pay for a change
                             // that measurably favoured the AI: longer ranged units, then
                             // the exposed front rank. Re-run the ladder before touching it.
var MAX_UNITS_PER_SIDE = 40;
var FRONT_SPEED = 22;        // how fast the trench line crawls, px/s at ui 1
var FRONT_RANK = 8;          // one unit in eight is in the open — see inCover()

/* ------------------------------- state --------------------------------- */
var W = 0, H = 0, DPR = 1;
var paperCv = null, bluePat = null, redPat = null;
var spriteCache = {};

var L = { ui: 1, hudH: 72, barH: 132, field: { x: 0, y: 0, w: 0, h: 0 } };

var G = {
  screen: "menu",        // menu | playing | over
  paused: false,
  speed: 1,
  diff: "recruit",
  guideOpen: false,
  time: DURATION,
  ink: 10,
  aiInk: 8,
  frontX: 0,
  blueLead: -1,          // deepest blue unit (its x); -1 while the army is empty
  redLead: 1e9,          // deepest red unit; the line may never cross either lead
  blueOpen: 1e9,         // blue forward of this x is in the open; 1e9 = nobody is
  redOpen: -1,           // red behind this x is in the open;  -1  = nobody is
  units: [],
  projs: [],
  fx: [],
  decor: [],
  lastKey: "soldier",    // Space repeats whatever you deployed last
  mode: "manual",        // "manual" = you point at the lane, "auto" = the game picks it
  aim: { x: 0, y: 0, set: false, kb: false },   // last point the player aimed at, in field px
  playerHQ: null,
  enemyHQ: null,
  aiTimer: 0,
  t: 0,
  mouse: { x: -9999, y: -9999 },
  helpOpen: false,
  helpPaused: false,
  hint: "",
  hintT: 0,
  result: null,
  endReason: ""
};

var buttons = [];
var BTN_ON = true;
var uid = 1;

function pushButton(b) { if (BTN_ON) buttons.push(b); }

/* ------------------------------ helpers -------------------------------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }

// Canvas has no auto-shrink for one-line captions, and a clipped hint is worse than
// a small one. Shrinks the current bold font until `text` fits `maxW`.
function fitFont(text, maxW, startPx) {
  var fs = Math.max(8, Math.round(startPx));
  ctx.font = "bold " + fs + "px " + FONT;
  while (fs > 8 && ctx.measureText(text).width > maxW) {
    fs--;
    ctx.font = "bold " + fs + "px " + FONT;
  }
  return fs;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffleWeighted(list) {
  var total = 0, i;
  for (i = 0; i < list.length; i++) total += list[i][1];
  var r = Math.random() * total;
  for (i = 0; i < list.length; i++) { r -= list[i][1]; if (r <= 0) return list[i][0]; }
  return list[list.length - 1][0];
}

/* --------------------------- doodle drawing ---------------------------- */
function sketchLine(c, x1, y1, x2, y2, rng, amp) {
  amp = amp === undefined ? 1.2 : amp;
  var mx = (x1 + x2) / 2 + (rng() * 2 - 1) * amp * 1.7;
  var my = (y1 + y2) / 2 + (rng() * 2 - 1) * amp * 1.7;
  c.beginPath();
  c.moveTo(x1 + (rng() * 2 - 1) * amp, y1 + (rng() * 2 - 1) * amp);
  c.quadraticCurveTo(mx, my, x2 + (rng() * 2 - 1) * amp, y2 + (rng() * 2 - 1) * amp);
  c.stroke();
}
function sketchRect(c, x, y, w, h, seed, amp, passes) {
  amp = amp === undefined ? 1.3 : amp;
  passes = passes === undefined ? 2 : passes;
  var rng = mulberry32(seed);
  for (var p = 0; p < passes; p++) {
    sketchLine(c, x, y, x + w, y, rng, amp);
    sketchLine(c, x + w, y, x + w, y + h, rng, amp);
    sketchLine(c, x + w, y + h, x, y + h, rng, amp);
    sketchLine(c, x, y + h, x, y, rng, amp);
  }
}
function sketchRoundRect(c, x, y, w, h, r, seed, amp) {
  var rng = mulberry32(seed);
  amp = amp === undefined ? 1.1 : amp;
  for (var p = 0; p < 2; p++) {
    c.beginPath();
    c.moveTo(x + r, y + (rng() * 2 - 1) * amp);
    c.lineTo(x + w - r, y + (rng() * 2 - 1) * amp);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.stroke();
  }
}
function sketchCircle(c, cx, cy, rad, seed, amp) {
  var rng = mulberry32(seed);
  amp = amp === undefined ? 1.1 : amp;
  var steps = 11;
  for (var p = 0; p < 2; p++) {
    c.beginPath();
    for (var i = 0; i <= steps; i++) {
      var a = (i / steps) * Math.PI * 2;
      var rr = rad + (rng() * 2 - 1) * amp;
      var x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath(); c.stroke();
  }
}
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function crossMark(c, x, y, s, rng) {
  c.beginPath();
  c.moveTo(x - s, y - s); c.lineTo(x + s, y + s);
  c.moveTo(x + s, y - s); c.lineTo(x - s, y + s);
  c.stroke();
  if (rng) {
    c.beginPath();
    c.moveTo(x - s * 0.7, y); c.lineTo(x + s * 0.7, y);
    c.stroke();
  }
}
function starBurst(c, x, y, s, rng, n) {
  n = n || 8;
  c.beginPath();
  for (var i = 0; i < n; i++) {
    var a = (i / n) * Math.PI * 2 + 0.3;
    var rr = s * (0.55 + rng() * 0.6);
    var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath(); c.stroke();
}
function wrapText(c, text, x, y, maxW, lh) {
  var words = text.split(" ");
  var line = "", yy = y;
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + " " + words[i] : words[i];
    if (c.measureText(test).width > maxW && line) {
      c.fillText(line, x, yy); line = words[i]; yy += lh;
    } else line = test;
  }
  if (line) c.fillText(line, x, yy);
  return yy;
}

/* ------------------------------ sizing --------------------------------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // measure the element itself: it is stretched to the viewport by CSS.
  // Keep the floor low, otherwise a narrow phone window gets squashed drawing.
  W = Math.max(320, Math.floor(cvs.clientWidth || window.innerWidth));
  H = Math.max(300, Math.floor(cvs.clientHeight || window.innerHeight));
  cvs.width = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  spriteCache = {};
  buildPaper();
  buildPatterns();
  layout();
}

function layout() {
  var ui = clamp(Math.min(W / 1032, H / 582), 0.62, 1.55);
  L.ui = ui;
  L.hudH = Math.min(Math.round(74 * ui), Math.round(H * 0.17));
  L.barH = Math.min(Math.round(134 * ui), Math.round(H * 0.33));
  L.field = { x: 0, y: L.hudH, w: W, h: H - L.hudH - L.barH };
  buildDecor();
}

function buildPaper() {
  paperCv = document.createElement("canvas");
  paperCv.width = Math.floor(W * DPR);
  paperCv.height = Math.floor(H * DPR);
  var g = paperCv.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = C.paper;
  g.fillRect(0, 0, W, H);

  // soft paper blotches so the sheet is not perfectly flat
  var r = mulberry32(7);
  for (var i = 0; i < 80; i++) {
    var x = r() * W, y = r() * H, rad = 24 + r() * 90;
    var grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, "rgba(186,203,226,0.055)");
    grd.addColorStop(1, "rgba(186,203,226,0)");
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, rad, 0, 6.2832); g.fill();
  }

  // the notebook grid
  var step = 26;
  g.lineWidth = 1;
  for (var gx = 0; gx <= W; gx += step) {
    var major = (Math.round(gx / step) % 5 === 0);
    g.strokeStyle = major ? C.gridMajor : C.gridMinor;
    g.beginPath(); g.moveTo(gx + 0.5, 0); g.lineTo(gx + 0.5, H); g.stroke();
  }
  for (var gy = 0; gy <= H; gy += step) {
    var major2 = (Math.round(gy / step) % 5 === 0);
    g.strokeStyle = major2 ? C.gridMajor : C.gridMinor;
    g.beginPath(); g.moveTo(0, gy + 0.5); g.lineTo(W, gy + 0.5); g.stroke();
  }

  // faint ballpoint scribbles in the margins
  g.strokeStyle = "rgba(90,130,195,0.10)";
  g.lineWidth = 1.2;
  var r2 = mulberry32(41);
  for (var k = 0; k < 10; k++) {
    var sx = r2() * W, sy = r2() * H;
    g.beginPath();
    g.moveTo(sx, sy);
    for (var s = 0; s < 5; s++) {
      sx += (r2() * 2 - 1) * 90; sy += (r2() * 2 - 1) * 40;
      g.lineTo(sx, sy);
    }
    g.stroke();
  }
}

function makeHatchPattern(color, size, dir, alpha) {
  var c = document.createElement("canvas");
  c.width = size; c.height = size;
  var g = c.getContext("2d");
  g.strokeStyle = color;
  g.globalAlpha = alpha === undefined ? 1 : alpha;
  g.lineWidth = 1.15;
  g.lineCap = "round";
  var lines = [[0, size, size, 0], [0, size * 0.5, size * 0.5, 0]];
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    g.beginPath();
    if (dir > 0) { g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); }
    else { g.moveTo(l[0], size - l[1]); g.lineTo(l[2], size - l[3]); }
    g.stroke();
  }
  return ctx.createPattern(c, "repeat");
}

function buildPatterns() {
  bluePat = makeHatchPattern(C.blue, 14, 1, 0.8);
  redPat = makeHatchPattern(C.red, 14, -1, 0.8);
}

function buildDecor() {
  G.decor = [];
  var f = L.field;
  var r = mulberry32(1337);
  for (var i = 0; i < 26; i++) {
    G.decor.push({
      x: 60 + r() * Math.max(40, W - 120),
      y: f.y + 24 + r() * Math.max(40, f.h - 48),
      s: 4 + r() * 7,
      t: r() < 0.55 ? "cross" : (r() < 0.6 ? "star" : "blob"),
      rot: (r() * 2 - 1) * 0.8,
      seed: (r() * 1e9) | 0
    });
  }
}

/* ---------------------------- unit sprite ------------------------------ */
var DRAW = {
  soldier: function (g, seed, col) {
    var r = mulberry32(seed);
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = 2.1; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.arc(1, -11, 6.6, Math.PI * 1.02, Math.PI * 1.98); g.stroke(); // helmet
    sketchCircle(g, 1, -9, 4.3, seed + 11, 0.55);                                   // head
    sketchLine(g, 1, -5.5, 1, 5, r, 0.5);                                           // torso
    sketchLine(g, 1, 5, -4.5, 13.5, r, 0.5);                                        // back leg
    sketchLine(g, 1, 5, 6, 13.5, r, 0.5);                                           // front leg
    sketchLine(g, 1, -3, 7.5, 0.5, r, 0.5);                                         // arm
    sketchLine(g, 2, -4, 9, -14, r, 0.5);                                           // rifle
    sketchLine(g, 7.5, -16.5, 10.5, -13, r, 0.5);                                   // muzzle
  },
  mg: function (g, seed, col) {
    var r = mulberry32(seed);
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = 2.1; g.lineCap = "round"; g.lineJoin = "round";
    sketchLine(g, -1, 2, -8.5, 14, r, 0.5);
    sketchLine(g, 1, 2, 8.5, 14, r, 0.5);
    sketchLine(g, 0, 2, 0, 14, r, 0.5);
    sketchRoundRect(g, -10, -5, 18, 9, 3, seed + 3, 0.6);
    sketchLine(g, 8, -1, 20, -2, r, 0.5);
    sketchLine(g, 8, -3.5, 20, -4.5, r, 0.5);
    sketchLine(g, -11, -9, -11, 4, r, 0.6);      // shield
    sketchLine(g, -9, -9, -9, 4, r, 0.5);
    sketchCircle(g, 2, -8, 3.2, seed + 9, 0.5);  // drum mag
  },
  tank: function (g, seed, col) {
    var r = mulberry32(seed);
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = 2.1; g.lineCap = "round"; g.lineJoin = "round";
    sketchRoundRect(g, -14, -5, 28, 13, 4, seed + 4, 0.7);
    sketchRoundRect(g, -6, -13, 13, 8, 3, seed + 5, 0.6);
    sketchLine(g, 6, -9, 21, -10, r, 0.5);
    sketchLine(g, 6, -12, 21, -13, r, 0.5);
    sketchLine(g, 21, -13.5, 21, -8.5, r, 0.4);
    for (var i = 0; i < 4; i++) sketchCircle(g, -9 + i * 6, 8, 3.0, seed + 20 + i, 0.5);
    sketchLine(g, -12, 0, 12, 0, r, 0.5);
  },
  artillery: function (g, seed, col) {
    var r = mulberry32(seed);
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = 2.1; g.lineCap = "round"; g.lineJoin = "round";
    sketchCircle(g, -6, 7, 6.5, seed + 6, 0.7);
    sketchCircle(g, -6, 7, 1.6, seed + 7, 0.4);
    sketchLine(g, -13, 9, 11, 9, r, 0.5);
    sketchLine(g, 8, 9, 15, 5, r, 0.5);
    sketchLine(g, -3, 3, 17, -11, r, 0.5);      // barrel (up-right)
    sketchLine(g, -1, 6, 19, -8, r, 0.5);
    sketchLine(g, 15, -14, 20, -11, r, 0.4);
    sketchLine(g, 2, 3, 4, 8, r, 0.4);
  },
  ink: function (g, seed, col) {
    var r = mulberry32(seed);
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = 2.1; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath();
    var pts = 12;
    for (var i = 0; i <= pts; i++) {
      var a = (i / pts) * Math.PI * 2;
      var rr = (i % 2 === 0 ? 11 : 7.5) + (r() * 2 - 1) * 1.6;
      var x = Math.cos(a) * rr, y = Math.sin(a) * rr + 1;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath(); g.stroke();
    g.globalAlpha = 0.5;
    g.beginPath(); g.arc(0, 1, 5.5, 0, 6.2832); g.fill();
    g.globalAlpha = 1;
    sketchLine(g, 0, 9, -1, 15, r, 0.6);
    sketchLine(g, 5, 8, 7, 14, r, 0.6);
  }
};

function unitSprite(key, side) {
  var id = key + "|" + side;
  if (spriteCache[id]) return spriteCache[id];
  var S = 76;
  var c = document.createElement("canvas");
  c.width = Math.round(S * DPR);
  c.height = Math.round(S * DPR);
  var g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.translate(S / 2, S / 2 + 2);
  if (side === "red") g.scale(-1, 1);
  var col = side === "blue" ? C.blue : C.red;
  DRAW[key](g, hashStr(id), col);
  var obj = { canvas: c, size: S };
  spriteCache[id] = obj;
  return obj;
}

/* ------------------------------- data ---------------------------------- */
/* Unit balance
   ------------
   Two armies spending the same ink should trade roughly evenly, so no unit is
   ever "strictly better". For a straight fight the quantity that has to match is
       Q = hp * dps / cost^2      (derived from: army HP x army DPS / time)
   Q is held near 1100 for line troops and bought down for units that get a
   special advantage instead:
       Soldier    Q ~1180  the yardstick: most hp and dps per ink, but fragile
       Tank       Q ~ 760  pays for concentration and surviving artillery
       Machine Gun Q ~ 670  pays for 168 range
       Artillery  Q ~ 180  pays for 285 range + splash, dies to anything close
   DPS is the real damage per second against one target, with the exposed front rank
   taking full damage and the support ranks taking half (both sides alike). */
var UNITS = {

  },

  },
  tank: {

    hp: 200, speed: 20, range: 96, dmg: 34, rate: 1.05,
    desc: "Armoured spearhead. Shells the trench from behind its own infantry, survives shellfire and breaks the enemy HQ."
  },

    desc: "Siege gun. The only unit that out-ranges the HQ watchtower, so it fires from the back of the field — but infantry that reaches it kills it."
  },
  ink: {

    desc: "Instant. Auto-aimed at the enemy's biggest knot: 175 damage across a whole trench column — it wipes out infantry even in cover."
  }
};
var ORDER = ["soldier", "mg", "tank", "artillery", "ink"];

var DIFFS = {
  recruit:  { name: "Recruit",  cn: "新兵", think: 2.4,  regen: 0.34, wave: 9, stat: 0.90, smart: 0,    blurb: "Slow waves, random picks." },
  sergeant: { name: "Sergeant", cn: "中士", think: 1.5,  regen: 0.56, wave: 6, stat: 1.00, smart: 0.55, blurb: "Steady pressure, reads your army." },
  general:  { name: "General",  cn: "将军", think: 0.95, regen: 0.80, wave: 5, stat: 1.06, smart: 1,    blurb: "Fast, counter-picks and fires for effect." }
};

/* ------------------------------ lifecycle ------------------------------ */
function startGame(diff) {
  G.diff = diff || G.diff;
  G.screen = "playing";
  G.paused = false;
  G.speed = 1;
  G.time = DURATION;
  G.ink = 10;
  G.aiInk = 8;
  G.units = [];
  G.projs = [];
  G.fx = [];
  G.lastKey = "soldier";
  G.aim.set = false;                     // the previous match's aim is not this match's
  G.aim.kb = false;
  G.result = null;
  G.endReason = "";
  G.aiTimer = 2.0;
  G.t = 0;
  G.hint = "";
  G.hintT = 0;
  G.helpOpen = false;
  uid = 1;

  var f = L.field;
  var m = Math.round(38 * L.ui);
  G.playerHQ = { side: "blue", isHQ: true, x: m, y: f.y + f.h / 2, hp: HQ_HP, maxHp: HQ_HP, flash: 0,
                 range: HQ_RANGE * L.ui, turretT: 0.6, calm: 0 };
  G.enemyHQ  = { side: "red",  isHQ: true, x: W - m, y: f.y + f.h / 2, hp: HQ_HP, maxHp: HQ_HP, flash: 0,
                 range: HQ_RANGE * L.ui, turretT: 0.6, calm: 0 };
  G.frontX = W / 2;
  G.blueLead = -1; G.redLead = 1e9;
  G.blueOpen = 1e9; G.redOpen = -1;
}

function endGame(reason) {
  if (G.screen === "over") return;
  G.endReason = reason;
  var pct = clamp(G.frontX / W, 0, 1);
  var win;
  if (G.enemyHQ.hp <= 0) win = "blue";
  else if (G.playerHQ.hp <= 0) win = "red";
  else win = pct >= 0.5 ? "blue" : "red";
  G.result = { win: win, pct: pct };
  G.screen = "over";
}

/* ------------------------------ spawning ------------------------------- */
function pickLane(side, x) {
  var f = L.field;
  var pad = 24 * L.ui;
  var top = f.y + pad, bot = f.y + f.h - pad;
  if (bot <= top) return f.y + f.h / 2;
  var best = top, bestScore = -1;
  for (var i = 0; i < 7; i++) {
    var y = top + Math.random() * (bot - top);
    var score = 1e9, j;
    for (j = 0; j < G.units.length; j++) {
      var u = G.units[j];
      if (u.side !== side) continue;
      var d = Math.abs(u.y - y) + Math.abs(u.x - x) * 0.25;
      if (d < score) score = d;
    }
    if (score > bestScore) { bestScore = score; best = y; }
  }
  return best;
}

function countSide(side) {
  var n = 0;
  for (var i = 0; i < G.units.length; i++) if (G.units[i].side === side) n++;
  return n;
}

function spawnUnit(side, type, x, preferY) {
  var d = UNITS[type];
  if (!d || d.instant) return null;
  if (countSide(side) >= MAX_UNITS_PER_SIDE) return null;
  var mul = side === "red" ? DIFFS[G.diff].stat : 1;
  var f = L.field;
  var pad = 18 * L.ui;
  // An explicit lane is honoured exactly — the player's auto-lane is a decision,
  // not a suggestion. Only the AI scouts for a gap with pickLane().
  var lane;
  if (typeof preferY === "number" && isFinite(preferY)) {
    lane = clamp(preferY, f.y + pad, f.y + f.h - pad);
  } else {
    lane = pickLane(side, x);
  }
  var u = {
    id: uid++, side: side, key: type, isHQ: false,
    x: clamp(x, 10, W - 10),
    y: lane,
    hp: d.hp * mul, maxHp: d.hp * mul,
    speed: d.speed * L.ui * 0.92,
    range: d.range * L.ui,
    dmg: d.dmg * mul,
    rate: d.rate,
    splash: d.splash ? d.splash * L.ui : 0,
    atkT: 0.3 + Math.random() * 0.35,
    flash: 0,
    walk: Math.random() * 6,
    seed: (Math.random() * 1e9) | 0,
    size: (type === "tank" ? 0.86 : (type === "mg" ? 0.8 : 0.74)) * L.ui
  };
  G.units.push(u);
  return u;
}

// Both armies march out of their own defence line and push towards the front.
var DEPLOY_LINE = 68;      // px behind the HQ, at ui 1

function deployLineX(side) {
  var hq = side === "blue" ? G.playerHQ.x : G.enemyHQ.x;
  var dir = side === "blue" ? 1 : -1;
  return hq + dir * (DEPLOY_LINE + (Math.random() * 2 - 1) * 22) * L.ui;
}

function playerSpawnX() {
  // never right of the line, and never right of the enemy's deepest scout
  var x = Math.min(deployLineX("blue"), G.frontX - 24 * L.ui);
  if (G.redLead <= W) x = Math.min(x, G.redLead - 34 * L.ui);
  return clamp(x, 12, W - 14);
}

function enemySpawnX() {
  // enemy troops march out of their own defence line on the far right — they no
  // longer materialise next to the front, and never behind our spearhead.
  var x = Math.max(deployLineX("red"), G.frontX + 24 * L.ui);
  if (G.blueLead >= 0) x = Math.max(x, G.blueLead + 34 * L.ui);
  return clamp(x, 12, W - 14);
}

// One tap = one unit on the field, so the lane has to be chosen for the player.
// Reinforce where the enemy is actually leaning, and refuse to stack: the score is
// "how close to the threatened lane" minus "how crowded with our own troops".
// Deterministic on purpose — a lane that jitters between frames reads as a bug.
function autoLane() {
  var f = L.field, ui = L.ui;
  var pad = 26 * ui;
  var top = f.y + pad, bot = f.y + f.h - pad;
  if (bot <= top) return f.y + f.h / 2;
  var rad = clamp(f.h * 0.20, 40 * ui, 110 * ui);

  // The lane the enemy is leaning on: weight each red unit by how deep into our
  // half it has pushed, so a breakthrough outranks a skirmish at the line.
  var ty = 0, tw = 0, i, u;
  for (i = 0; i < G.units.length; i++) {
    u = G.units[i];
    if (u.side !== "red") continue;
    var press = 1 + clamp((G.frontX - u.x) / Math.max(1, G.frontX), 0, 1) * 1.8;
    ty += u.y * press;
    tw += press;
  }
  if (tw <= 0) ty = f.y + f.h / 2; else ty /= tw;

  var best = clamp(ty, top, bot), bestScore = -1e9;
  for (var s = 0; s < 9; s++) {
    var y = top + (bot - top) * (s / 8);
    var score = -Math.abs(y - ty) * 0.9;
    for (i = 0; i < G.units.length; i++) {
      u = G.units[i];
      if (u.side !== "blue") continue;
      var d = Math.abs(u.y - y);
      if (d < rad) score -= (rad - d) * 0.55;
    }
    if (score > bestScore) { bestScore = score; best = y; }
  }
  return clamp(best, top, bot);
}

// Same problem for the blot: the player picked "ink this knot", not "ink x=417".
// Densest cluster of red shirts wins; ties break towards the one nearest our HQ.
function autoBlotTarget() {
  var ui = L.ui;
  var reach = UNITS.ink.radius * ui;
  var best = null, bestScore = -1e9;
  for (var i = 0; i < G.units.length; i++) {
    var a = G.units[i];
    if (a.side !== "red") continue;
    var n = 0;
    for (var j = 0; j < G.units.length; j++) {
      var b = G.units[j];
      if (b.side !== "red") continue;
      if (Math.abs(a.x - b.x) < reach && Math.abs(a.y - b.y) < 110 * ui) n++;
    }
    var score = n * 10 + (1 - clamp(a.x / W, 0, 1)) * 6;
    if (score > bestScore) { bestScore = score; best = a; }
  }
  if (best) return { x: best.x, y: best.y };
  // nothing on the field: ink the enemy watchtower rather than waste the ink
  return { x: G.enemyHQ.x, y: G.enemyHQ.y };
}

/* ----------------------------- projectiles ----------------------------- */
function spawnBullet(from, target, dmg) {
  var tx, ty;
  if (target.isHQ) { tx = target.x; ty = target.y + (Math.random() * 2 - 1) * 20 * L.ui; }
  else { tx = target.x; ty = target.y; }
  G.projs.push({
    kind: "bullet", side: from.side,
    x: from.x + (from.side === "blue" ? 10 : -10) * L.ui,
    y: from.y - 2 * L.ui,
    target: target, tx: tx, ty: ty,
    speed: 520 * L.ui, dmg: dmg, dead: false,
    seed: (Math.random() * 1e9) | 0
  });
}

function spawnShell(from, target, dmg, splash) {
  var tx, ty;
  if (target.isHQ) {
    tx = target.x;
    ty = target.y + (Math.random() * 2 - 1) * 20 * L.ui;
  } else {
    // Lead a target that is actually walking: aim where it will be when the
    // shell lands. A unit that has stopped to shoot is aimed at directly.
    var flight = clamp(Math.abs(target.x - from.x) / (300 * L.ui), 0.35, 1.6);
    var tdir = target.side === "blue" ? 1 : -1;
    var lead = target.attacking ? 0 : tdir * target.speed * flight;
    tx = target.x + lead;
    ty = target.y + (Math.random() * 2 - 1) * 12 * L.ui;
  }
  var dist = Math.abs(tx - from.x);
  G.projs.push({
    kind: "shell", side: from.side,
    x: from.x, y: from.y, sx: from.x, sy: from.y,
    tx: tx, ty: ty, t: 0, dur: clamp(dist / (300 * L.ui), 0.35, 1.6),
    dmg: dmg, splash: splash, dead: false,
    seed: (Math.random() * 1e9) | 0
  });
}

function spawnInkBlot(side, tx, ty, dmg, radius) {
  var from = side === "blue" ? G.playerHQ : G.enemyHQ;
  var dist = Math.hypot(tx - from.x, ty - from.y);
  G.projs.push({
    kind: "blot", side: side,
    x: from.x, y: from.y, sx: from.x, sy: from.y,
    tx: tx, ty: ty, t: 0, dur: clamp(dist / (520 * L.ui), 0.3, 1.1),
    dmg: dmg, splash: radius, dead: false,
    seed: (Math.random() * 1e9) | 0
  });
}

/* -------------------------------- combat ------------------------------- */
// Half damage, unless you are in the open.
//
// Exposure is a property of a *line*, not of whichever unit happens to be deepest:
// one unit in FRONT_RANK is in the open, and a force smaller than that is entirely
// dug in. Making a lone unit its own front rank would strip the tank and the
// artillery of half their effective hp — a lone heavy unit would always be exposed —
// and that flips the locked counter-triangle (4 soldiers stop beating a tank).
// Do not "simplify" this back to a distance from the deepest unit.
function inCover(u) {
  if (u.side === "blue") return u.x < G.blueOpen;
  return u.x > G.redOpen;
}

function damageUnit(u, dmg) {
  if (u.hp <= 0) return;
  if (inCover(u)) dmg *= 0.5;            // 50% damage reduction for the support ranks
  u.hp -= dmg;
  u.flash = 0.16;
  if (u.hp <= 0) killUnit(u);
}

function killUnit(u) {
  u.hp = 0;
  splat(u.x, u.y, u.side === "blue" ? C.blue : C.red, 10 * L.ui, (Math.random() * 1e9) | 0);
  var i = G.units.indexOf(u);
  if (i >= 0) G.units.splice(i, 1);
}

function damageHQ(hq, dmg) {
  hq.hp -= dmg;
  hq.flash = 0.2;
  if (hq.hp <= 0) {
    hq.hp = 0;
    var n = 22;
    for (var i = 0; i < n; i++) {
      splat(hq.x + (Math.random() * 2 - 1) * 50 * L.ui,
            hq.y + (Math.random() * 2 - 1) * 90 * L.ui,
            hq.side === "blue" ? C.blue : C.red, 14 * L.ui, (Math.random() * 1e9) | 0);
    }
    endGame(hq.side === "red" ? "hq" : "hqLost");
  }
}

// Combat is fought along one axis, so a shell or a blot inks a tall column of
// trench rather than a circle. SPLASH_SQUASH squashes the vertical axis.
var SPLASH_SQUASH = 0.5;

function splashDist(ax, ay, bx, by, radius) {
  // Squash the vertical axis, but never so little that a blot fails to cover the
  // whole trench column — the field is taller than it is wide on some windows.
  var k = Math.min(SPLASH_SQUASH, 0.85 * radius / Math.max(1, L.field.h * 0.5));
  var dx = ax - bx, dy = (ay - by) * k;
  return Math.sqrt(dx * dx + dy * dy);
}

function areaDamage(side, x, y, radius, dmg) {
  var hits = 0;
  for (var i = G.units.length - 1; i >= 0; i--) {
    var u = G.units[i];
    if (u.side === side) continue;
    var d = splashDist(u.x, u.y, x, y, radius);
    if (d <= radius) {
      var f = 1 - (d / radius) * 0.55;
      damageUnit(u, dmg * f);
      hits++;
    }
  }
  var hq = side === "blue" ? G.enemyHQ : G.playerHQ;
  if (Math.abs(hq.x - x) < radius * 0.8) { damageHQ(hq, dmg * 0.35); hits++; }
  return hits;
}

/* --------------------------------- fx ---------------------------------- */
function splat(x, y, color, size, seed, yScale) {
  yScale = yScale || 1;
  var r = mulberry32(seed);
  var dots = [];
  for (var i = 0; i < 9; i++) {
    var a = r() * 6.2832, d = r() * size;
    dots.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * yScale, r: 1 + r() * size * 0.22 });
  }
  G.fx.push({ type: "splat", x: x, y: y, dots: dots, color: color, t: 0, life: 0.65, size: size });
}
function ring(x, y, radius, color) {
  G.fx.push({ type: "ring", x: x, y: y, r0: radius * 0.25, r1: radius, color: color,
              t: 0, life: 0.5, ys: SPLASH_SQUASH });
}

/* ------------------------------- update -------------------------------- */
// The side that is losing ground writes faster: a small comeback trickle so one
// bad clash does not decide the whole match.
function comebackMul(side) {
  var share = side === "blue" ? G.frontX / W : 1 - G.frontX / W;
  if (share >= 0.45) return 1;
  return 1 + (0.45 - share) * 1.6;
}

function update(dt) {
  G.t += dt;
  // timer
  G.time -= dt;
  if (G.time <= 0) { G.time = 0; endGame("time"); return; }

  // ink economy (with a comeback trickle for whoever is being pushed back)
  G.ink = Math.min(10, G.ink + PLAYER_REGEN * comebackMul("blue") * dt);
  G.aiInk = Math.min(10, G.aiInk + DIFFS[G.diff].regen * comebackMul("red") * dt);

  updateAI(dt);
  updateUnits(dt);
  updateProjectiles(dt);
  if (G.screen !== "playing") return;   // a headquarters may have just fallen
  updateFront(dt);
  updateFX(dt);
  updateHQDefense(G.playerHQ, dt);
  updateHQDefense(G.enemyHQ, dt);
  regenerateHQ(G.playerHQ, dt);
  regenerateHQ(G.enemyHQ, dt);

  G.playerHQ.flash = Math.max(0, G.playerHQ.flash - dt);
  G.enemyHQ.flash = Math.max(0, G.enemyHQ.flash - dt);
  if (G.hintT > 0) G.hintT -= dt;
}

// A headquarters that is not under attack patches its own sandbags back up.
function regenerateHQ(hq, dt) {
  var foe = hq.side === "blue" ? "red" : "blue";
  var threat = false;
  for (var i = 0; i < G.units.length; i++) {
    var u = G.units[i];
    if (u.side === foe && Math.abs(u.x - hq.x) < 175 * L.ui) { threat = true; break; }
  }
  if (threat) { hq.calm = 0; return; }
  hq.calm = (hq.calm || 0) + dt;
  if (hq.calm > 4 && hq.hp < hq.maxHp) {
    hq.hp = Math.min(hq.maxHp, hq.hp + HQ_REGEN * dt);
  }
}

// The HQ watchtower keeps lone raiders from strolling in and ending the match.
function updateHQDefense(hq, dt) {
  hq.turretT = (hq.turretT || 0) - dt;
  if (hq.hp <= 0) return;
  var best = null, bestD = hq.range;
  for (var i = 0; i < G.units.length; i++) {
    var u = G.units[i];
    if (u.side === hq.side) continue;
    var d = Math.abs(u.x - hq.x);
    if (d < bestD) { bestD = d; best = u; }
  }
  if (best && hq.turretT <= 0) {
    hq.turretT = HQ_RATE;
    G.projs.push({
      kind: "bullet", side: hq.side,
      x: hq.x + (hq.side === "blue" ? 16 : -16) * L.ui,
      y: hq.y - 30 * L.ui,
      target: best, tx: best.x, ty: best.y,
      speed: 620 * L.ui, dmg: HQ_DPS, dead: false, seed: 0
    });
  }
}

function updateUnits(dt) {
  var i, j, u;
  for (i = 0; i < G.units.length; i++) {
    u = G.units[i];
    u.flash = Math.max(0, u.flash - dt);
    u.atkT -= dt;

    // nearest enemy in range (1D combat, x distance)
    var best = null, bestD = 1e9;
    for (j = 0; j < G.units.length; j++) {
      var o = G.units[j];
      if (o.side === u.side) continue;
      var d = Math.abs(o.x - u.x);
      if (d <= u.range && d < bestD) { bestD = d; best = o; }
    }
    var hq = u.side === "blue" ? G.enemyHQ : G.playerHQ;
    var dh = Math.abs(hq.x - u.x);
    if (dh <= u.range && dh < bestD) { bestD = dh; best = hq; }

    if (best) {
      u.attacking = true;
      if (u.atkT <= 0) {
        u.atkT = u.rate;
        if (u.key === "artillery") spawnShell(u, best, u.dmg, u.splash);
        else if (u.isHQ) { /* never */ }
        else spawnBullet(u, best, u.dmg);
        muzzle(u);
      }
    } else {
      u.attacking = false;
      var dir = u.side === "blue" ? 1 : -1;
      u.x += dir * u.speed * dt;
      u.walk += dt * 6;
    }
    u.x = clamp(u.x, 8, W - 8);
  }

  // soft separation so the doodles stay readable
  for (i = 0; i < G.units.length; i++) {
    for (j = i + 1; j < G.units.length; j++) {
      var a = G.units[i], b = G.units[j];
      if (a.side !== b.side) continue;
      var dx = b.x - a.x, dy = b.y - a.y;
      if (Math.abs(dx) < 16 * L.ui && Math.abs(dy) < 15 * L.ui) {
        var push = (15 * L.ui - Math.abs(dy)) * 0.9 * dt * 8;
        var s = dy >= 0 ? 1 : -1;
        a.y -= s * push; b.y += s * push;
      }
    }
  }
  var f = L.field, pad = 18 * L.ui;
  for (i = 0; i < G.units.length; i++) {
    G.units[i].y = clamp(G.units[i].y, f.y + pad, f.y + f.h - pad);
  }
}

function muzzle(u) {
  var x = u.x + (u.side === "blue" ? 12 : -12) * L.ui;
  G.fx.push({ type: "spark", x: x, y: u.y - 3 * L.ui, t: 0, life: 0.12,
              color: u.side === "blue" ? C.blue : C.red });
}

function updateProjectiles(dt) {
  var i;
  for (i = G.projs.length - 1; i >= 0; i--) {
    var p = G.projs[i];
    if (p.kind === "bullet") {
      var tgt = p.target;
      if (tgt && (tgt.isHQ ? tgt.hp > 0 : tgt.hp > 0)) { p.tx = tgt.x; p.ty = tgt.y; }
      var dx = p.tx - p.x, dy = p.ty - p.y;
      var d = Math.hypot(dx, dy);
      var step = p.speed * dt;
      if (d <= step || d < 1) {
        if (tgt && tgt.hp > 0) {
          if (tgt.isHQ) damageHQ(tgt, p.dmg); else damageUnit(tgt, p.dmg);
        }
        G.projs.splice(i, 1);
        continue;
      }
      p.x += (dx / d) * step; p.y += (dy / d) * step;
      p.ang = Math.atan2(dy, dx);
    } else {
      p.t += dt;
      var k = p.t / p.dur;
      if (k >= 1) {
        // land
        ring(p.tx, p.ty, p.splash, p.side === "blue" ? C.blue : C.red);
        splat(p.tx, p.ty, p.side === "blue" ? C.blue : C.red, p.splash * 0.5, p.seed, 1 / SPLASH_SQUASH);
        areaDamage(p.side, p.tx, p.ty, p.splash, p.dmg);
        if (p.kind === "blot") {
          G.frontX += (p.side === "blue" ? 1 : -1) * 46 * L.ui;
        }
        G.projs.splice(i, 1);
        continue;
      }
      p.x = lerp(p.sx, p.tx, k);
      p.y = lerp(p.sy, p.ty, k) - Math.sin(k * Math.PI) * (p.kind === "blot" ? 70 : 46) * L.ui;
    }
  }
}

function updateFront(dt) {
  var i, blues = [], reds = [], u;
  for (i = 0; i < G.units.length; i++) {
    u = G.units[i];
    if (u.side === "blue") blues.push(u.x); else reds.push(u.x);
  }
  // average of the three deepest units per side: one lucky scout cannot yank the line
  blues.sort(function (a, b) { return b - a; });
  reds.sort(function (a, b) { return a - b; });

  var pLead = G.playerHQ.x + 46 * L.ui;
  var eLead = G.enemyHQ.x - 46 * L.ui;
  var K = 3, s, n;
  if (blues.length) {
    s = 0; n = Math.min(K, blues.length);
    for (i = 0; i < n; i++) s += blues[i];
    pLead = Math.max(pLead, s / n);
  }
  if (reds.length) {
    s = 0; n = Math.min(K, reds.length);
    for (i = 0; i < n; i++) s += reds[i];
    eLead = Math.min(eLead, s / n);
  }

  var margin = 72 * L.ui;
  var target = clamp((pLead + eLead) / 2, margin, W - margin);

  // Ground near a headquarters is fortified: the line crawls there, which buys a
  // beaten side the time to rally instead of losing the match in one bad minute.
  var home = W * 0.24;
  var resist = 1;
  if (target > W - home || target < home) resist = 0.42;

  var spd = FRONT_SPEED * L.ui * resist;
  G.frontX += clamp(target - G.frontX, -spd * dt, spd * dt);
  G.frontX = clamp(G.frontX, margin * 0.5, W - margin * 0.5);

  // The line is a boundary, not just a trailing average. It may never sit behind the
  // deepest unit of either army, or that unit would be standing on the wrong side of
  // the line it is supposed to be holding. Note the target above is still the midpoint
  // of the two *averages* — that is the intent; this clamp is the guarantee.
  G.blueLead = blues.length ? blues[0] : -1;
  G.redLead = reds.length ? reds[0] : 1e9;

  // Who is standing in the open: the deepest slice of each army, one unit in
  // FRONT_RANK. A force smaller than FRONT_RANK has no front rank to expose, so it is
  // all in cover — that is what keeps lone tanks and artillery viable.
  var k = Math.floor(blues.length / FRONT_RANK);
  G.blueOpen = k > 0 ? blues[k - 1] : 1e9;
  k = Math.floor(reds.length / FRONT_RANK);
  G.redOpen = k > 0 ? reds[k - 1] : -1;

  if (blues.length && reds.length && G.blueLead <= G.redLead) {
    G.frontX = clamp(G.frontX, G.blueLead, G.redLead);
  } else {
    // no army on one side, or the two are somehow interleaved: hold our own lead.
    if (blues.length) G.frontX = Math.max(G.frontX, G.blueLead);
    if (reds.length) G.frontX = Math.min(G.frontX, G.redLead);
  }
}

function updateFX(dt) {
  for (var i = G.fx.length - 1; i >= 0; i--) {
    G.fx[i].t += dt;
    if (G.fx[i].t >= G.fx[i].life) G.fx.splice(i, 1);
  }
}

/* --------------------------------- AI ---------------------------------- */
function aiComposition() {
  var c = { soldier: 0, mg: 0, tank: 0, artillery: 0, total: 0 };
  for (var i = 0; i < G.units.length; i++) {
    var u = G.units[i];
    if (u.side !== "blue") continue;
    c[u.key] = (c[u.key] || 0) + 1;
    c.total++;
  }
  return c;
}

function clusterOfBlueUnits(minCount) {
  var best = null, bestN = 0;
  for (var i = 0; i < G.units.length; i++) {
    var a = G.units[i];
    if (a.side !== "blue") continue;
    var n = 0;
    for (var j = 0; j < G.units.length; j++) {
      var b = G.units[j];
      if (b.side !== "blue") continue;
      if (Math.abs(a.x - b.x) < 105 * L.ui && Math.abs(a.y - b.y) < 110 * L.ui) n++;
    }
    if (n > bestN) { bestN = n; best = a; }
  }
  return bestN >= minCount ? best : null;
}

function pickAIType() {
  var dd = DIFFS[G.diff];
  var ink = G.aiInk;
  var c = aiComposition();

  if (dd.smart === 0) {
    // Recruit: cheap, mostly random, never reads the board.
    var pool = [["soldier", 5], ["mg", 2], ["tank", 2], ["artillery", 1]];
    var avail = [];
    for (var i = 0; i < pool.length; i++) {
      if (UNITS[pool[i][0]].cost <= ink) avail.push(pool[i]);
    }
    if (!avail.length) return null;
    return shuffleWeighted(avail);
  }

  // Never sit on a full ink meter — that is how an army loses the field.
  if (ink >= 8.5) {
    var rich = [["soldier", 1]];
    if (ink >= 2) rich.push(["mg", 1]);
    if (ink >= 3) rich.push(["tank", 1.4]);
    if (ink >= 4) rich.push(["artillery", 1]);
    if (ink >= 5) rich.push(["ink", 0.8]);
    return shuffleWeighted(rich.filter(function (p) { return UNITS[p[0]].cost <= ink; }));
  }

  var opts = [];
  var soldierShare = c.total ? c.soldier / c.total : 0;

  // counter-picks
  if (c.soldier >= 2 && ink >= 2) opts.push(["mg", 2.6 * dd.smart]);        // guns beat crowds
  if (c.tank >= 1 && ink >= 4) opts.push(["artillery", 2.4 * dd.smart]);    // guns crack armour
  if (c.mg >= 1 && ink >= 3) opts.push(["tank", 2.4 * dd.smart]);           // armour closes on guns
  if (c.artillery >= 1 && ink >= 1) opts.push(["soldier", 2.2 * dd.smart]); // swarm the artillery

  // baseline army shape: a cheap core, one gun, one anchor
  if (ink >= 1) opts.push(["soldier", soldierShare > 0.62 ? 0.7 : 2.2]);
  if (ink >= 2) opts.push(["mg", c.mg < 2 ? 1.2 : 0.5]);
  if (ink >= 3) opts.push(["tank", c.tank < Math.max(1, Math.floor(c.total / 4)) ? 1.5 : 0.7]);
  if (ink >= 4) opts.push(["artillery", c.artillery < 2 ? 0.9 : 0.25]);

  if (dd.smart >= 1) {
    // General keeps its powder dry for armour when it has none and the field is small.
    if (ink < 6 && c.tank === 0 && c.total > 2 && Math.random() < 0.5) {
      return "soldier";
    }
  }
  if (!opts.length) return null;
  return shuffleWeighted(opts);
}

function updateAI(dt) {
  var dd = DIFFS[G.diff];
  G.aiTimer -= dt;
  if (G.aiTimer > 0) return;
  G.aiTimer = dd.think * (0.75 + Math.random() * 0.5);

  if (countSide("red") >= MAX_UNITS_PER_SIDE) return;

  // Ink Splash only when it genuinely pays: a real cluster, or a full meter.
  if (dd.smart > 0 && G.aiInk >= 5) {
    var want = dd.smart >= 1 ? 4 : 5;
    var cl = clusterOfBlueUnits(want);
    if (cl && (G.aiInk >= 9 || Math.random() < 0.35 + dd.smart * 0.3)) {
      G.aiInk -= UNITS.ink.cost;
      spawnInkBlot("red", cl.x, cl.y, UNITS.ink.dmg, UNITS.ink.radius * L.ui);
      return;
    }
  }

  // Because troops must now march all the way from the red line, the AI saves up
  // and releases a whole group at once — the way a player clicking quickly would.
  var urgent = G.frontX > W * 0.60;
  if (G.aiInk < (urgent ? 1 : dd.wave)) return;

  var released = 0;
  while (released < 5 && countSide("red") < MAX_UNITS_PER_SIDE) {
    var type = pickAIType();
    if (!type) break;
    var cost = UNITS[type].cost;
    if (G.aiInk < cost) break;
    G.aiInk -= cost;
    released++;

    if (type === "ink") {
      var tgt = clusterOfBlueUnits(3);
      spawnInkBlot("red", tgt ? tgt.x : G.frontX - 40 * L.ui,
                   tgt ? tgt.y : L.field.y + L.field.h / 2,
                   UNITS.ink.dmg, UNITS.ink.radius * L.ui);
    } else {
      spawnUnit("red", type, enemySpawnX());
    }
  }
}

/* ------------------------------- input --------------------------------- */
function canvasPos(e) {
  var r = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top) * (H / r.height)
  };
}

function hitButton(x, y) {
  for (var i = buttons.length - 1; i >= 0; i--) {
    var b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

function setHint(msg) {
  G.hint = msg;
  G.hintT = 2.0;
}

// Deploying costs exactly one action: pick a card and the unit is already on its
// way. There is never a second click on the battlefield. *Where* it comes out is a
// setting: manual (you point, the game remembers the point) or auto (the game reads
// the battle and picks).
var DEPLOY_HINT = "按 1–5 或点卡片出兵 · Press 1–5 or tap a card to deploy";
var AIM_HINT = "已瞄准此处,点卡片出兵 · Aimed — now tap a card";

function overField(x, y) {
  var f = L.field;
  return x >= 0 && x <= W && y >= f.y - 6 * L.ui && y <= f.y + f.h + 6 * L.ui;
}

function toggleMode() {
  G.mode = (G.mode === "manual") ? "auto" : "manual";
  setHint(G.mode === "manual"
    ? "出兵位置:手动(移动鼠标或用方向键瞄准)· Lane: manual"
    : "出兵位置:自动(系统挑车道)· Lane: auto");
}

// The lane the next unit marches out on. Manual mode reuses the last point aimed
// at — never the live pointer — because picking a card drags the pointer down to
// the tray and that must not move the lane.
function targetLane() {
  var f = L.field, pad = 26 * L.ui;
  if (G.mode === "manual" && G.aim.set) return clamp(G.aim.y, f.y + pad, f.y + f.h - pad);
  return autoLane();
}

function targetBlot() {
  if (G.mode === "manual" && G.aim.set) return { x: G.aim.x, y: G.aim.y };
  return autoBlotTarget();
}

function deployCard(key) {
  if (G.screen !== "playing" || G.paused) return;
  var def = UNITS[key];
  if (!def) return;
  if (G.ink < def.cost) { setHint("墨水不足 · Not enough ink"); return; }

  if (def.instant) {
    var t = targetBlot();
    G.ink -= def.cost;
    G.lastKey = key;
    spawnInkBlot("blue", t.x, t.y, def.dmg, def.radius * L.ui);
    return;
  }

  if (countSide("blue") >= MAX_UNITS_PER_SIDE) {
    setHint("部队已满 " + MAX_UNITS_PER_SIDE + " · Unit limit reached");
    return;
  }
  // Spawn first, pay only if a unit actually appeared.
  var made = spawnUnit("blue", key, playerSpawnX(), targetLane());
  if (!made) {
    setHint("部队已满 " + MAX_UNITS_PER_SIDE + " · Unit limit reached");
    return;
  }
  G.ink -= def.cost;
  G.lastKey = key;
  ring(made.x, made.y, 30 * L.ui, C.blue);   // "it came out right here"
}

cvs.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var p = canvasPos(e);
  G.mouse.x = p.x; G.mouse.y = p.y;

  var b = hitButton(p.x, p.y);
  if (b) { b.action(); return; }

  if (G.screen === "playing" && !G.paused && overField(p.x, p.y)) {
    // A click on the field still does not deploy anything — it aims, or it explains.
    setHint(G.mode === "manual" ? AIM_HINT : DEPLOY_HINT);
  }
});

cvs.addEventListener("pointermove", function (e) {
  var p = canvasPos(e);
  G.mouse.x = p.x; G.mouse.y = p.y;
  if (overField(p.x, p.y)) {
    G.aim.x = p.x;
    G.aim.y = clamp(p.y, L.field.y, L.field.y + L.field.h);
    G.aim.set = true;
    G.aim.kb = false;                    // the pointer takes over the aim
  }
});

cvs.addEventListener("pointerleave", function () {
  G.mouse.x = -9999; G.mouse.y = -9999;
});

cvs.addEventListener("contextmenu", function (e) { e.preventDefault(); });

/* --------------------------- keyboard controls -------------------------
   1-5      deploy that unit now     Space  deploy the same one again
   M        manual / auto lane       arrows / WASD  aim (manual mode)
   P / Esc  pause / resume           F      1x / 2x speed
   H or ?   this shortcut list       G unit guide   Enter play / again     */
var MOVE_KEYS = {
  ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
  a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1],
  A: [-1, 0], D: [1, 0], W: [0, -1], S: [0, 1]
};

function moveAim(dx, dy, fast) {
  var f = L.field;
  if (!G.aim.set || !G.aim.kb) {
    // first arrow press picks the cursor up where the pointer left it
    G.aim.kb = true;
    if (!G.aim.set) { G.aim.x = G.playerHQ.x + DEPLOY_LINE * L.ui; G.aim.y = f.y + f.h / 2; }
    G.aim.set = true;
    return;                              // don't also nudge on the activating press
  }
  var step = (fast ? 46 : 15) * L.ui;
  G.aim.x = clamp(G.aim.x + dx * step, 6, W - 6);
  G.aim.y = clamp(G.aim.y + dy * step, f.y + 10 * L.ui, f.y + f.h - 10 * L.ui);
}

function setHelp(open) {
  G.helpOpen = open;
  if (open) {
    // never let the battle run on behind the help card
    if (G.screen === "playing" && !G.paused) { G.paused = true; G.helpPaused = true; }
  } else if (G.helpPaused) {
    G.paused = false;
    G.helpPaused = false;
  }
}

window.addEventListener("keydown", function (e) {
  var k = e.key;
  var key = (k.length === 1) ? k.toLowerCase() : k;

  // help overlay works everywhere
  if (key === "h" || k === "?" || k === "/") { setHelp(!G.helpOpen); e.preventDefault(); return; }
  if (G.helpOpen) {
    if (k === "Escape" || k === "Enter" || k === " ") setHelp(false);
    e.preventDefault();
    return;
  }

  if (G.screen === "menu") {
    if (key === "1") G.diff = "recruit";
    else if (key === "2") G.diff = "sergeant";
    else if (key === "3") G.diff = "general";
    else if (k === "Enter" || k === " ") { startGame(G.diff); e.preventDefault(); }
    else if (key === "g") G.guideOpen = !G.guideOpen;
    else if (key === "m") toggleMode();
    else if (k === "Escape") G.guideOpen = false;
    else if (k === "ArrowLeft" || k === "ArrowRight") {
      var order = ["recruit", "sergeant", "general"];
      var i = order.indexOf(G.diff) + (k === "ArrowRight" ? 1 : -1);
      G.diff = order[clamp(i, 0, 2)];
    }
    return;
  }

  if (G.screen === "over") {
    if (k === "Enter" || k === " ") { startGame(G.diff); e.preventDefault(); }
    else if (k === "Escape" || key === "m") G.screen = "menu";
    return;
  }

  // ---- in a match ----
  if (k === "Escape" || key === "p") { G.paused = !G.paused; return; }
  if (key === "f") { G.speed = G.speed === 1 ? 2 : 1; return; }
  if (key >= "1" && key <= "5") {
    var pick = ORDER[parseInt(key, 10) - 1];
    if (pick) deployCard(pick);
    return;
  }
  if (k === " " || k === "Enter") {
    e.preventDefault();
    if (G.paused) { G.paused = false; return; }
    deployCard(G.lastKey);          // hold it down to keep the push coming
    return;
  }
  if (key === "m") { toggleMode(); return; }
  if (MOVE_KEYS[k]) {
    e.preventDefault();
    if (G.mode === "manual") moveAim(MOVE_KEYS[k][0], MOVE_KEYS[k][1], e.shiftKey);
    else setHint(DEPLOY_HINT);      // in auto mode the arrows have nothing to aim
  }
});

/* ------------------------------ rendering ------------------------------ */
function render() {
  buttons.length = 0;
  BTN_ON = (G.screen !== "over");
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(paperCv, 0, 0, W, H);

  if (G.screen === "menu") drawMenu();
  else drawGame();

  if (G.screen === "over") { BTN_ON = true; drawOver(); }
  if (G.helpOpen) { BTN_ON = true; drawHelpModal(); }
}

// The battlefield's only job is to show *where* the next unit will land: the
// defence line, and the lane the current setting picked for it.
function drawDeployGuide() {
  var ui = L.ui, f = L.field;
  var lx = G.playerHQ.x + DEPLOY_LINE * ui;
  var ly = targetLane();
  var manual = (G.mode === "manual" && G.aim.set);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, f.y, W, f.h); ctx.clip();

  // dashed line every blue unit marches out of
  ctx.strokeStyle = "rgba(23,53,156,0.5)";
  ctx.lineWidth = 2;
  ctx.setLineDash([7 * ui, 6 * ui]);
  ctx.beginPath();
  ctx.moveTo(lx, f.y + 4);
  ctx.lineTo(lx, f.y + f.h - 4);
  ctx.stroke();
  ctx.setLineDash([]);

  // manual mode: a ghost of what is coming, so the aim reads as exact
  if (manual && G.lastKey !== "ink") {
    var sp = unitSprite(G.lastKey, "blue");
    var s = sp.size * 0.8;
    ctx.globalAlpha = 0.3;
    ctx.drawImage(sp.canvas, lx - s / 2, ly - s / 2, s, s);
    ctx.globalAlpha = 1;
  }

  // manual mode: which trench column the blot would ink
  if (manual && G.lastKey === "ink") {
    var t = targetBlot();
    var band = UNITS.ink.radius * ui;
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = "rgba(23,53,156,0.12)";
    ctx.fillRect(t.x - band, f.y, band * 2, f.h);
    ctx.strokeStyle = C.blue;
    ctx.lineWidth = 2;
    ctx.setLineDash([8 * ui, 6 * ui]);
    ctx.beginPath();
    ctx.moveTo(t.x - band, f.y + 4); ctx.lineTo(t.x - band, f.y + f.h - 4);
    ctx.moveTo(t.x + band, f.y + 4); ctx.lineTo(t.x + band, f.y + f.h - 4);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = C.blueDeep;
    ctx.beginPath();
    ctx.moveTo(t.x - 15 * ui, t.y); ctx.lineTo(t.x + 15 * ui, t.y);
    ctx.moveTo(t.x, t.y - 15 * ui); ctx.lineTo(t.x, t.y + 15 * ui);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // the lane the next unit will take — a chevron, so nobody reads it as a unit
  ctx.globalAlpha = manual ? 0.85 : 0.45;
  ctx.strokeStyle = "rgba(23,53,156,0.9)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(lx - 13 * ui, ly);
  ctx.lineTo(lx + 13 * ui, ly);
  ctx.moveTo(lx - 6 * ui, ly - 8 * ui);
  ctx.lineTo(lx, ly - 2 * ui);
  ctx.lineTo(lx + 6 * ui, ly - 8 * ui);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // label sits to the right of the line so the HQ wire never runs through it
  var label = G.mode === "manual"
    ? "防线 · deploy line · 手动 manual"
    : "防线 · deploy line · 自动 auto";
  ctx.fillStyle = C.blue;
  ctx.font = "bold " + Math.round(11 * ui) + "px " + FONT;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(label, lx + 8 * ui, f.y + 14 * ui);

  // keyboard reticle, manual mode only
  if (manual && G.aim.kb) {
    var r = Math.max(15 * ui, 14 * ui);
    ctx.strokeStyle = "rgba(16,29,74,0.85)";
    ctx.beginPath();
    ctx.arc(lx, ly, r, 0, 6.2832);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lx - r - 5 * ui, ly); ctx.lineTo(lx - r + 2 * ui, ly);
    ctx.moveTo(lx + r - 2 * ui, ly); ctx.lineTo(lx + r + 5 * ui, ly);
    ctx.moveTo(lx, ly - r - 5 * ui); ctx.lineTo(lx, ly - r + 2 * ui);
    ctx.moveTo(lx, ly + r - 2 * ui); ctx.lineTo(lx, ly + r + 5 * ui);
    ctx.stroke();
  }

  ctx.restore();
  ctx.textAlign = "left";
}

function drawGame() {
  drawTerritory();
  drawDecor();
  drawHQ(G.playerHQ);
  drawHQ(G.enemyHQ);
  drawFront();
  drawDeployGuide();
  drawUnits();
  drawProjectiles();
  drawFX();
  drawHUD();
  drawBar();
  drawHint();
  if (G.paused && !G.helpOpen) drawPaused();
}

/* --- battlefield --- */
function drawTerritory() {
  var f = L.field;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, f.y, W, f.h); ctx.clip();

  ctx.fillStyle = "rgba(84,126,205,0.10)";
  ctx.fillRect(0, f.y, G.frontX, f.h);
  ctx.fillStyle = "rgba(198,63,68,0.09)";
  ctx.fillRect(G.frontX, f.y, W - G.frontX, f.h);

  ctx.globalAlpha = 0.30;
  ctx.fillStyle = bluePat;
  ctx.fillRect(0, f.y, G.frontX, f.h);
  ctx.fillStyle = redPat;
  ctx.fillRect(G.frontX, f.y, W - G.frontX, f.h);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawDecor() {
  var f = L.field;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, f.y, W, f.h); ctx.clip();
  ctx.globalAlpha = 0.30;
  ctx.lineWidth = 1.4;
  for (var i = 0; i < G.decor.length; i++) {
    var d = G.decor[i];
    var blue = d.x < G.frontX;
    ctx.strokeStyle = blue ? C.blue : C.red;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    var rng = mulberry32(d.seed);
    if (d.t === "cross") crossMark(ctx, 0, 0, d.s, rng);
    else if (d.t === "star") starBurst(ctx, 0, 0, d.s, rng, 7);
    else sketchCircle(ctx, 0, 0, d.s * 0.8, d.seed, 0.8);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawFront() {
  var f = L.field;
  var fx = G.frontX;
  var rng = mulberry32(991);
  var y;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, f.y, W, f.h); ctx.clip();

  // trench hatching band
  ctx.strokeStyle = "rgba(26,36,64,0.42)";
  ctx.lineWidth = 1.3;
  for (y = f.y - 12; y < f.y + f.h + 12; y += 7) {
    var w = 7 * L.ui + Math.sin((y + G.t * 4) * 0.05) * 2.5;
    ctx.beginPath(); ctx.moveTo(fx - w, y); ctx.lineTo(fx + w, y + 7); ctx.stroke();
  }

  // the front line itself: wobbly ink strokes
  ctx.strokeStyle = "#1b2a52";
  ctx.lineWidth = 2.1;
  ctx.lineCap = "round";
  for (var p = 0; p < 2; p++) {
    ctx.beginPath();
    for (y = f.y; y <= f.y + f.h; y += 14) {
      var x = fx + Math.sin(y * 0.03 + p * 1.9) * 5 * L.ui + (rng() * 2 - 1) * 2;
      if (y === f.y) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // barbed crosses along the trench
  ctx.strokeStyle = "rgba(26,36,64,0.75)";
  ctx.lineWidth = 1.6;
  for (y = f.y + 22; y < f.y + f.h - 10; y += 36 * L.ui) {
    crossMark(ctx, fx + (rng() * 2 - 1) * 6 * L.ui, y, 6 * L.ui, rng);
  }
  ctx.restore();
}

function drawHQ(hq) {
  var f = L.field;
  var ui = L.ui;
  var dir = hq.side === "blue" ? 1 : -1;
  var col = hq.side === "blue" ? C.blue : C.red;
  var rng = mulberry32(hq.side === "blue" ? 555 : 777);
  var wallX = hq.x + dir * 30 * ui;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, f.y, W, f.h); ctx.clip();
  ctx.strokeStyle = col;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // defensive wire
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(wallX, f.y + 6); ctx.lineTo(wallX, f.y + f.h - 6);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  for (var y = f.y + 14; y < f.y + f.h - 10; y += 22 * ui) {
    sketchCircle(ctx, wallX, y, 4.5 * ui, (rng() * 1e9) | 0, 0.7);
  }

  // fortress block
  var bw = 44 * ui, bh = 84 * ui;
  var bx = hq.x - bw / 2, by = hq.y - bh / 2;
  ctx.lineWidth = 2.2;
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  roundRectPath(ctx, bx, by, bw, bh, 5 * ui);
  ctx.fill();
  sketchRoundRect(ctx, bx, by, bw, bh, 5 * ui, hq.side === "blue" ? 21 : 22, 1.1);

  // cross hatch inside
  ctx.save();
  roundRectPath(ctx, bx, by, bw, bh, 5 * ui);
  ctx.clip();
  ctx.lineWidth = 1.1;
  ctx.globalAlpha = 0.42;
  for (var d = -bh; d < bw + bh; d += 7 * ui) {
    ctx.beginPath();
    ctx.moveTo(bx + d, by);
    ctx.lineTo(bx + d - bh, by + bh);
    ctx.stroke();
  }
  ctx.restore();

  // flag
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(hq.x, by - 4 * ui);
  ctx.lineTo(hq.x, by - 34 * ui);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hq.x, by - 34 * ui);
  ctx.lineTo(hq.x + dir * 24 * ui, by - 27 * ui);
  ctx.lineTo(hq.x, by - 19 * ui);
  ctx.closePath();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = col;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.stroke();

  // glow when hit
  if (hq.flash > 0) {
    ctx.globalAlpha = hq.flash * 2.4;
    ctx.fillStyle = "#fff";
    roundRectPath(ctx, bx - 4, by - 4, bw + 8, bh + 8, 6 * ui);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawUnits() {
  var i;
  for (i = 0; i < G.units.length; i++) drawUnit(G.units[i]);
}

function drawUnit(u) {
  var sp = unitSprite(u.key, u.side);
  var s = sp.size * u.size;
  var bob = u.attacking ? Math.sin(G.t * 9 + u.id) * 1.2 * L.ui
                        : Math.sin(u.walk) * 1.8 * L.ui;
  var x = u.x - s / 2;
  var y = u.y - s / 2 + bob;

  // shield hint: the support ranks take half damage, the open front rank does not
  if (inCover(u)) {
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = u.side === "blue" ? C.blue : C.red;
    ctx.lineWidth = 1.6;
    ctx.setLineDash([4 * L.ui, 3 * L.ui]);
    ctx.beginPath();
    ctx.ellipse(u.x, u.y + s * 0.34, s * 0.24, s * 0.08, 0, 0, 6.2832);
    ctx.stroke();
    ctx.restore();
  }

  ctx.drawImage(sp.canvas, x, y, s, s);

  if (u.flash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.6, u.flash * 3);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(u.x, u.y, s * 0.3, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  // damage bar only when hurt
  if (u.hp < u.maxHp - 0.01) {
    var bw = 22 * L.ui, bh = 3 * L.ui;
    var bx = u.x - bw / 2, by = u.y - s * 0.42;
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = u.side === "blue" ? C.blue : C.red;
    ctx.fillRect(bx, by, bw * clamp(u.hp / u.maxHp, 0, 1), bh);
    ctx.strokeStyle = "rgba(20,30,60,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
  }
}

function drawProjectiles() {
  for (var i = 0; i < G.projs.length; i++) {
    var p = G.projs[i];
    var col = p.side === "blue" ? C.blue : C.red;
    if (p.kind === "bullet") {
      var a = p.ang || 0;
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(p.x - Math.cos(a) * 9 * L.ui, p.y - Math.sin(a) * 9 * L.ui);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      // the ground a shell or blot will cover: a band right across the trench
      ctx.save();
      ctx.globalAlpha = 0.40;
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.6;
      ctx.setLineDash([5, 5]);
      var bandW = p.splash * 0.8;
      ctx.beginPath();
      ctx.rect(p.tx - bandW, L.field.y + 2, bandW * 2, L.field.h - 4);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(p.tx - bandW, p.ty);
      ctx.lineTo(p.tx + bandW, p.ty);
      ctx.stroke();
      ctx.restore();

      // the flying shell / blot
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (p.kind === "blot" ? 7 : 3.4) * L.ui, 0, 6.2832);
      ctx.fill();
      if (p.kind === "blot") {
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        sketchCircle(ctx, p.x, p.y, 8 * L.ui, p.seed, 1.4);
      }
    }
  }
}

function drawFX() {
  var i, j;
  for (i = 0; i < G.fx.length; i++) {
    var e = G.fx[i];
    var k = e.t / e.life;
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.85;
    if (e.type === "splat") {
      ctx.fillStyle = e.color;
      for (j = 0; j < e.dots.length; j++) {
        var d = e.dots[j];
        ctx.beginPath();
        ctx.arc(e.x + d.x * (0.6 + k * 0.9), e.y + d.y * (0.6 + k * 0.9), d.r * (1 - k * 0.4), 0, 6.2832);
        ctx.fill();
      }
    } else if (e.type === "ring") {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 3 * (1 - k) + 1;
      var rr = lerp(e.r0, e.r1, k);
      var ry = Math.min(rr / (e.ys || 1), L.field.h / 2 - 2);
      ctx.beginPath();
      ctx.ellipse(e.x, e.y, rr, ry, 0, 0, 6.2832);
      ctx.stroke();
    } else if (e.type === "spark") {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (j = 0; j < 5; j++) {
        var ang = (j / 5) * 6.2832 + e.x;
        var rr = 7 * L.ui * (0.5 + k);
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(ang) * rr, e.y + Math.sin(ang) * rr);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* --- HUD --- */
function drawHealthBar(x, y, w, h, ratio, side) {
  var col = side === "blue" ? C.blue : C.red;
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  roundRectPath(ctx, x, y, w, h, h / 2);
  ctx.fill();

  ctx.save();
  roundRectPath(ctx, x, y, w, h, h / 2);
  ctx.clip();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = side === "blue" ? bluePat : redPat;
  var fw = w * clamp(ratio, 0, 1);
  if (side === "blue") ctx.fillRect(x, y, fw, h);
  else ctx.fillRect(x + w - fw, y, fw, h);
  ctx.restore();

  ctx.lineWidth = 2;
  ctx.strokeStyle = "#1d2b55";
  roundRectPath(ctx, x, y, w, h, h / 2);
  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  var ui = L.ui;
  var pad = 16 * ui;
  var barW = Math.min(W * 0.30, 330 * ui);
  var barH = 15 * ui;
  var top = 12 * ui;

  ctx.textBaseline = "alphabetic";
  ctx.font = "bold " + Math.round(15 * ui) + "px " + FONT;
  ctx.textAlign = "left";
  ctx.fillStyle = C.blue;
  ctx.fillText("Your HQ", pad, top + 12 * ui);
  drawHealthBar(pad, top + 18 * ui, barW, barH, G.playerHQ.hp / G.playerHQ.maxHp, "blue");

  ctx.textAlign = "right";
  ctx.fillStyle = C.red;
  ctx.fillText("Red HQ", W - pad, top + 12 * ui);
  drawHealthBar(W - pad - barW, top + 18 * ui, barW, barH, G.enemyHQ.hp / G.enemyHQ.maxHp, "red");

  // clock
  var t = Math.max(0, Math.ceil(G.time));
  var mm = Math.floor(t / 60);
  var ss = t % 60;
  var label = mm + ":" + (ss < 10 ? "0" : "") + ss;
  ctx.textAlign = "center";
  ctx.font = "bold " + Math.round(40 * ui) + "px " + FONT;
  ctx.fillStyle = G.time <= 20 ? C.red : "#16234c";
  ctx.fillText(label, W / 2, top + 34 * ui);

  var pct = Math.round(clamp(G.frontX / W, 0, 1) * 100);
  ctx.font = "bold " + Math.round(15 * ui) + "px " + FONT;
  ctx.fillStyle = "#28345c";
  ctx.fillText("Your territory " + pct + "%", W / 2, top + 54 * ui);

  // pause / speed buttons
  var bs = 26 * ui;
  var by = L.hudH - bs - 6 * ui;
  drawIconButton(pad, by, bs, G.paused ? "play" : "pause", function () {
    G.paused = !G.paused;
  });
  drawIconButton(pad + bs + 8 * ui, by, bs, G.speed === 1 ? "ff" : "ffx", function () {
    G.speed = G.speed === 1 ? 2 : 1;
  });
}

function drawIconButton(x, y, s, kind, action) {
  var hover = G.mouse.x >= x && G.mouse.x <= x + s && G.mouse.y >= y && G.mouse.y <= y + s;
  ctx.save();
  ctx.fillStyle = hover ? "rgba(220,232,250,0.95)" : "rgba(255,255,255,0.85)";
  roundRectPath(ctx, x, y, s, s, 5 * L.ui);
  ctx.fill();
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = "#1d2b55";
  ctx.stroke();

  ctx.strokeStyle = "#1d2b55";
  ctx.fillStyle = "#1d2b55";
  ctx.lineWidth = 2;
  var cx = x + s / 2, cy = y + s / 2;
  if (kind === "pause") {
    ctx.beginPath();
    ctx.moveTo(cx - 4 * L.ui, cy - 6 * L.ui); ctx.lineTo(cx - 4 * L.ui, cy + 6 * L.ui);
    ctx.moveTo(cx + 4 * L.ui, cy - 6 * L.ui); ctx.lineTo(cx + 4 * L.ui, cy + 6 * L.ui);
    ctx.stroke();
  } else if (kind === "play") {
    ctx.beginPath();
    ctx.moveTo(cx - 4 * L.ui, cy - 6 * L.ui);
    ctx.lineTo(cx + 6 * L.ui, cy);
    ctx.lineTo(cx - 4 * L.ui, cy + 6 * L.ui);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - 6 * L.ui, cy - 5 * L.ui); ctx.lineTo(cx, cy); ctx.lineTo(cx - 6 * L.ui, cy + 5 * L.ui);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 1 * L.ui, cy - 5 * L.ui); ctx.lineTo(cx + 7 * L.ui, cy); ctx.lineTo(cx + 1 * L.ui, cy + 5 * L.ui);
    ctx.closePath(); ctx.fill();
    if (kind === "ff") {
      ctx.font = "bold " + Math.round(9 * L.ui) + "px " + FONT;
      ctx.fillText("1x", cx - 6 * L.ui, cy + 8 * L.ui);
    }
  }
  ctx.restore();
  pushButton({ id: "icon-" + kind, x: x, y: y, w: s, h: s, action: action });
}

/* --- bottom bar --- */
function cardRects() {
  var ui = L.ui;
  var gap = 10 * ui;
  var n = ORDER.length;
  var maxW = 148 * ui;
  var cw = Math.min(maxW, (W - 40 * ui - gap * (n - 1)) / n);
  var ch = Math.min(L.barH - 44 * ui, 96 * ui);
  var totalW = cw * n + gap * (n - 1);
  var x0 = (W - totalW) / 2;
  var y0 = H - L.barH + 38 * ui;
  var out = [];
  for (var i = 0; i < n; i++) {
    out.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch, key: ORDER[i] });
  }
  return out;
}

function drawBar() {
  var ui = L.ui;
  var top = H - L.barH;

  // paper strip + torn edge
  ctx.save();
  ctx.fillStyle = "rgba(253,252,245,0.94)";
  ctx.fillRect(0, top, W, L.barH);
  ctx.strokeStyle = "rgba(29,43,85,0.5)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, top);
  for (var x = 0; x <= W; x += 18) {
    ctx.lineTo(x, top + Math.sin(x * 0.05) * 2.2 + 1);
  }
  ctx.stroke();
  ctx.restore();

  // ---- ink meter
  var mw = Math.min(W * 0.62, 560 * ui);
  var mh = 24 * ui;
  var mx = (W - mw) / 2;
  var my = top + 8 * ui;

  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  roundRectPath(ctx, mx, my, mw, mh, mh / 2);
  ctx.fill();

  ctx.save();
  roundRectPath(ctx, mx, my, mw, mh, mh / 2);
  ctx.clip();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = bluePat;
  ctx.fillRect(mx, my, mw * (G.ink / 10), mh);
  ctx.restore();

  // cell dividers
  ctx.strokeStyle = "rgba(29,43,85,0.55)";
  ctx.lineWidth = 1.4;
  for (var i = 1; i < 10; i++) {
    var sx = mx + (mw / 10) * i;
    ctx.beginPath();
    ctx.moveTo(sx, my + 3 * ui);
    ctx.lineTo(sx, my + mh - 3 * ui);
    ctx.stroke();
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#1d2b55";
  roundRectPath(ctx, mx, my, mw, mh, mh / 2);
  ctx.stroke();
  ctx.restore();

  var inkShown = Math.floor(G.ink);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(14 * ui) + "px " + FONT;
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  var inkLabel = "Ink " + inkShown + "/10";
  ctx.strokeText(inkLabel, W / 2, my + mh / 2 + 1);
  ctx.fillStyle = "#16234c";
  ctx.fillText(inkLabel, W / 2, my + mh / 2 + 1);

  // ---- standing order: one tap deploys. Drawn ABOVE the tray, over the bottom of
  // the field, so the unit cards can never cover it.
  var tip = "点卡片或按 1\u20135 出兵,Space 重复 \u00b7 Tap a card or press 1\u20135; Space repeats";
  var tfs = Math.round(14 * ui);
  ctx.font = "bold " + tfs + "px " + FONT;
  while (tfs > 8 && ctx.measureText(tip).width > W - 56 * ui) {
    tfs--;
    ctx.font = "bold " + tfs + "px " + FONT;
  }
  var tw2 = ctx.measureText(tip).width + 26 * ui;
  var th2 = 26 * ui;
  var tx2 = W / 2 - tw2 / 2;
  var ty2 = top - th2 - 9 * ui;
  ctx.save();
  ctx.fillStyle = "rgba(255,254,248,0.95)";
  roundRectPath(ctx, tx2, ty2, tw2, th2, th2 / 2);
  ctx.fill();
  ctx.strokeStyle = C.blue;
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.fillStyle = "#16234c";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(tip, W / 2, ty2 + th2 / 2 + 1);
  // red arrow pointing down at the deployment bar
  ctx.fillStyle = C.red;
  ctx.beginPath();
  var ax = W / 2, ay = ty2 + th2 + 2 * ui;
  ctx.moveTo(ax - 7 * ui, ay); ctx.lineTo(ax + 7 * ui, ay); ctx.lineTo(ax, ay + 10 * ui);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ---- army counter, so the unit cap is never a mystery
  var allyN = countSide("blue"), foeN = countSide("red");
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(13 * ui) + "px " + FONT;
  ctx.fillStyle = allyN >= MAX_UNITS_PER_SIDE ? C.red : "#4a5578";
  ctx.fillText("Units " + allyN + "/" + MAX_UNITS_PER_SIDE, 14 * ui, my + mh / 2);
  ctx.textAlign = "right";
  ctx.fillStyle = "#4a5578";
  ctx.fillText("Enemy " + foeN, W - 14 * ui, my + mh / 2);
  ctx.restore();

  // ---- unit cards
  var cards = cardRects();
  for (var c = 0; c < cards.length; c++) drawCard(cards[c], c);

  // ---- deploy-lane mode pill, in the gutter left of the tray (always visible, and
  // clickable, so the setting is never a mystery mid-match)
  var pillW = Math.min(cards[0].x - 24 * ui, 108 * ui);
  if (pillW > 48 * ui) {
    var pillH = 28 * ui;
    var pillX = 12 * ui, pillY = cards[0].y + 6 * ui;
    var manual = G.mode === "manual";
    ctx.save();
    ctx.fillStyle = manual ? "#eef3fc" : "rgba(255,255,255,0.92)";
    roundRectPath(ctx, pillX, pillY, pillW, pillH, pillH / 2);
    ctx.fill();
    ctx.strokeStyle = manual ? C.blue : "#8b93a8";
    ctx.lineWidth = 1.6;
    roundRectPath(ctx, pillX, pillY, pillW, pillH, pillH / 2);
    ctx.stroke();
    ctx.fillStyle = "#16234c";
    ctx.font = "bold " + Math.round(11 * ui) + "px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(manual ? "手动 Manual" : "自动 Auto", pillX + pillW / 2, pillY + pillH / 2 + 1);
    ctx.restore();
    pushButton({ id: "mode", x: pillX, y: pillY, w: pillW, h: pillH, action: toggleMode });
  }

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawCard(rect, index) {
  var ui = L.ui;
  var def = UNITS[rect.key];
  var afford = G.ink >= def.cost;
  var hover = G.mouse.x >= rect.x && G.mouse.x <= rect.x + rect.w &&
              G.mouse.y >= rect.y && G.mouse.y <= rect.y + rect.h;
  var rng = mulberry32(700 + index * 37);

  ctx.save();
  ctx.globalAlpha = afford ? 1 : 0.42;

  if (hover && afford) {
    ctx.shadowColor = "rgba(23,53,156,0.35)";
    ctx.shadowBlur = 12 * ui;
  }
  ctx.fillStyle = C.cardBg;
  roundRectPath(ctx, rect.x, rect.y, rect.w, rect.h, 8 * ui);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = (hover && afford) ? "#3a5fc8" : "#1d2b55";
  ctx.lineWidth = (hover && afford) ? 2.8 : 2;
  sketchRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 8 * ui, 700 + index * 91, 1.0);

  // sprite
  var sp = unitSprite(rect.key, "blue");
  var s = Math.min(rect.h * 0.52, 54 * ui);
  ctx.drawImage(sp.canvas, rect.x + rect.w / 2 - s / 2, rect.y + rect.h * 0.18, s, s);

  ctx.globalAlpha = 1;

  // index badge (top-left)
  ctx.save();
  ctx.globalAlpha = afford ? 1 : 0.5;
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "#1d2b55";
  ctx.lineWidth = 1.4;
  roundRectPath(ctx, rect.x + 5 * ui, rect.y + 5 * ui, 17 * ui, 17 * ui, 3 * ui);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#1d2b55";
  ctx.font = "bold " + Math.round(11 * ui) + "px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(index + 1), rect.x + 5 * ui + 8.5 * ui, rect.y + 5 * ui + 9 * ui);
  ctx.restore();

  // cost badge (top-right)
  var cx = rect.x + rect.w - 15 * ui, cy = rect.y + 15 * ui;
  ctx.save();
  ctx.globalAlpha = afford ? 1 : 0.55;
  ctx.beginPath();
  ctx.arc(cx, cy, 11 * ui, 0, 6.2832);
  ctx.fillStyle = afford ? C.blue : C.grey;
  ctx.fill();
  ctx.strokeStyle = "#0e2270";
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "bold " + Math.round(12 * ui) + "px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(def.cost), cx, cy + 0.5);
  ctx.restore();

  // name
  ctx.globalAlpha = afford ? 1 : 0.45;
  ctx.fillStyle = "#16234c";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  var fs = Math.max(10, Math.round(Math.min(15 * ui, rect.w / 8.2)));
  ctx.font = "bold " + fs + "px " + FONT;
  ctx.fillText(def.name, rect.x + rect.w / 2, rect.y + rect.h - 9 * ui);
  ctx.restore();

  pushButton({
    id: "card-" + rect.key, x: rect.x, y: rect.y, w: rect.w, h: rect.h,
    cardKey: rect.key, action: function () { deployCard(rect.key); }
  });
}

function drawHint() {
  if (G.hintT <= 0 || !G.hint) return;
  var a = Math.min(1, G.hintT);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(15 * L.ui) + "px " + FONT;
  var wdt = ctx.measureText(G.hint).width + 28 * L.ui;
  var hgt = 30 * L.ui;
  // just above the deployment tray, where the player is already looking
  var x = W / 2, y = H - L.barH - hgt - 42 * L.ui;
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  roundRectPath(ctx, x - wdt / 2, y, wdt, hgt, 6 * L.ui);
  ctx.fill();
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.fillStyle = C.red;
  ctx.fillText(G.hint, x, y + hgt / 2 + 1);
  ctx.restore();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawPaused() {
  ctx.save();
  ctx.fillStyle = "rgba(240,244,250,0.55)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(52 * L.ui) + "px " + FONT;
  ctx.fillStyle = "#16234c";
  ctx.fillText("PAUSED", W / 2, H / 2 - 10 * L.ui);
  ctx.font = "bold " + Math.round(16 * L.ui) + "px " + FONT;
  ctx.fillStyle = "#3a4a72";
  ctx.fillText("press P to resume", W / 2, H / 2 + 30 * L.ui);
  ctx.restore();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

/* --- menu --- */
function drawButton(x, y, w, h, label, opts) {
  opts = opts || {};
  var ui = L.ui;
  var hover = G.mouse.x >= x && G.mouse.x <= x + w && G.mouse.y >= y && G.mouse.y <= y + h;
  var active = !!opts.active;
  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  var fill = active ? "#ffd54a" : (opts.primary ? "#1f47b8" : "#fffef8");
  if (hover) fill = active ? "#ffdf6e" : (opts.primary ? "#2a55cc" : "#eef3fc");

  // the red "shadow" edge under the primary button
  if (opts.primary) {
    ctx.fillStyle = "rgba(198,39,45,0.9)";
    roundRectPath(ctx, x + 3 * ui, y + 7 * ui, w, h, 8 * ui);
    ctx.fill();
  }

  ctx.fillStyle = fill;
  roundRectPath(ctx, x, y, w, h, 8 * ui);
  ctx.fill();
  ctx.strokeStyle = opts.primary ? "#0e2270" : "#1d2b55";
  ctx.lineWidth = 2.4;

function drawMenuVignette(x, y, w, h) {
  var ui = clamp(w / 430, 0.7, 1.3);
  ctx.save();

  // the "photo" card
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  roundRectPath(ctx, x, y, w, h, 4 * ui);
  ctx.fill();
  ctx.save();
  roundRectPath(ctx, x, y, w, h, 4 * ui);
  ctx.clip();

  var horizon = y + h * 0.52;
  ctx.fillStyle = "rgba(214,140,140,0.20)";
  ctx.fillRect(x, y, w, horizon - y);
  ctx.fillStyle = "rgba(120,150,215,0.20)";
  ctx.fillRect(x, horizon, w, y + h - horizon);

  ctx.strokeStyle = "rgba(120,160,210,0.35)";
  ctx.lineWidth = 1;
  for (var gx = x; gx < x + w; gx += 22 * ui) {
    ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke();
  }
  for (var gy = y; gy < y + h; gy += 22 * ui) {
    ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
  }

  // trench line
  var rng = mulberry32(4242);
  ctx.strokeStyle = "#1b2a52";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (var px = x; px <= x + w; px += 12 * ui) {
    var py = horizon + Math.sin(px * 0.05) * 6 * ui + (rng() * 2 - 1) * 2;
    if (px === x) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.strokeStyle = "rgba(26,36,64,0.5)";
  ctx.lineWidth = 1.3;
  for (var hx = x + 10; hx < x + w - 6; hx += 16 * ui) {
    ctx.beginPath();
    ctx.moveTo(hx - 5 * ui, horizon + 8 * ui);
    ctx.lineTo(hx + 5 * ui, horizon + 14 * ui);
    ctx.stroke();
  }

  // a few doodle soldiers on both sides
  function paste(side, key, px2, py2, s) {
    var sp = unitSprite(key, side);
    var size = 46 * ui * s;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.drawImage(sp.canvas, x + px2 * w - size / 2, y + py2 * h - size / 2, size, size);
    ctx.restore();
  }
  paste("red", "soldier", 0.20, 0.24, 1);
  paste("red", "soldier", 0.42, 0.16, 0.85);
  paste("red", "mg", 0.70, 0.34, 1.05);
  paste("blue", "soldier", 0.14, 0.86, 1.0);
  paste("blue", "mg", 0.36, 0.74, 1.1);
  paste("blue", "artillery", 0.60, 0.80, 1.15);
  paste("blue", "tank", 0.80, 0.68, 1.1);

  // star bursts
  ctx.strokeStyle = "rgba(30,45,90,0.75)";
  ctx.lineWidth = 1.4;
  starBurst(ctx, x + w * 0.30, horizon - 26 * ui, 9 * ui, rng, 8);
  starBurst(ctx, x + w * 0.86, horizon - 16 * ui, 8 * ui, rng, 8);
  ctx.restore();

  // card outline
  ctx.strokeStyle = "#1d2b55";
  ctx.lineWidth = 2;
  sketchRect(ctx, x, y, w, h, 909, 1.6);

  // tape corners
  ctx.fillStyle = C.tape;
  var tapes = [[x + 8 * ui, y - 2 * ui, -0.6], [x + w - 54 * ui, y + h - 12 * ui, 0.5]];
  for (var i = 0; i < tapes.length; i++) {
    ctx.save();
    ctx.translate(tapes[i][0] + 23 * ui, tapes[i][1] + 8 * ui);
    ctx.rotate(tapes[i][2]);
    ctx.fillRect(-23 * ui, -8 * ui, 46 * ui, 16 * ui);
    ctx.strokeStyle = C.tapeLine;
    ctx.lineWidth = 1;
    ctx.strokeRect(-23 * ui, -8 * ui, 46 * ui, 16 * ui);
    ctx.restore();
  }
  ctx.restore();
}

function drawGuideModal() {
  var ui = L.ui;
  ctx.save();
  ctx.fillStyle = "rgba(236,241,248,0.82)";
  ctx.fillRect(0, 0, W, H);

  var rows = ORDER.length;
  var pw = Math.min(W * 0.86, 780 * ui);
  var rowH = Math.min(86 * ui, (H * 0.80 - 96 * ui) / rows);
  var ph = rowH * rows + 96 * ui;
  var px = (W - pw) / 2, py = (H - ph) / 2;

  ctx.fillStyle = "rgba(255,254,248,0.98)";
  roundRectPath(ctx, px, py, pw, ph, 10 * ui);
  ctx.fill();
  ctx.strokeStyle = "#1d2b55";
  ctx.lineWidth = 2.2;
  sketchRoundRect(ctx, px, py, pw, ph, 10 * ui, 4711, 1.4);

  // tape
  ctx.fillStyle = C.tape;
  ctx.save();
  ctx.translate(px + pw / 2, py + 4 * ui);
  ctx.rotate(-0.025);
  ctx.fillRect(-46 * ui, -8 * ui, 92 * ui, 16 * ui);
  ctx.strokeStyle = C.tapeLine;
  ctx.lineWidth = 1;
  ctx.strokeRect(-46 * ui, -8 * ui, 92 * ui, 16 * ui);
  ctx.restore();

  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.font = "bold " + Math.round(21 * ui) + "px " + FONT;
  ctx.fillStyle = C.blue;
  ctx.fillText("Unit guide · 单位图鉴", px + pw / 2, py + 40 * ui);

  var iconW = rowH * 0.78;
  var textX = px + 20 * ui + iconW + 10 * ui;
  var textW = pw - (textX - px) - 22 * ui;

  for (var i = 0; i < rows; i++) {
    var key = ORDER[i];
    var def = UNITS[key];
    var ry = py + 62 * ui + i * rowH;

    if (i % 2 === 0) {
      ctx.fillStyle = "rgba(210,222,240,0.30)";
      roundRectPath(ctx, px + 12 * ui, ry - 2 * ui, pw - 24 * ui, rowH - 4 * ui, 5 * ui);
      ctx.fill();
    }

    var sp = unitSprite(key, "blue");
    ctx.drawImage(sp.canvas, px + 20 * ui, ry + rowH / 2 - iconW / 2, iconW, iconW);

    ctx.textAlign = "left";
    ctx.font = "bold " + Math.round(15 * ui) + "px " + FONT;
    ctx.fillStyle = "#16234c";
    ctx.fillText(def.name + "  " + def.cn, textX, ry + rowH * 0.28);

    var costW = ctx.measureText(def.name).width;
    ctx.font = "bold " + Math.round(13 * ui) + "px " + FONT;
    ctx.fillStyle = C.blue;
    ctx.fillText(def.cost + " ink", textX + Math.max(costW, textW * 0.42) + 16 * ui, ry + rowH * 0.28);

    ctx.font = "bold " + Math.round(11.5 * ui) + "px " + FONT;
    ctx.fillStyle = "#5a6488";
    var stats;
    if (def.instant) stats = "instant · radius " + def.radius + " · " + def.dmg + " dmg";
    else stats = "hp " + def.hp + " · dps " + (def.dmg / def.rate).toFixed(1) +
                 " · range " + def.range + " · speed " + def.speed;
    ctx.fillText(stats, textX, ry + rowH * 0.52);

    ctx.font = "bold " + Math.round(11.5 * ui) + "px " + FONT;
    ctx.fillStyle = "#4a5578";
    wrapText(ctx, def.desc, textX, ry + rowH * 0.76, textW, 13 * ui);
  }

  ctx.textAlign = "center";
  ctx.font = "bold " + Math.round(12 * ui) + "px " + FONT;
  ctx.fillStyle = "#6b7699";
  ctx.fillText("click anywhere or press G to close", px + pw / 2, py + ph - 14 * ui);
  ctx.restore();

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  pushButton({ id: "guide-close", x: 0, y: 0, w: W, h: H,
               action: function () { G.guideOpen = false; } });
}

/* -------------------------------- loop --------------------------------- */
var last = 0;
function frame(now) {
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  if (G.screen === "playing" && !G.paused) {
    var steps = G.speed;
    for (var i = 0; i < steps; i++) {
      if (G.screen === "playing") update(dt);
    }
  } else {
    G.t += dt;
  }

  render();
  requestAnimationFrame(frame);
}

/* ------------------------------- boot ---------------------------------- */
window.addEventListener("resize", function () {
  resize();
  if (G.screen !== "menu" && G.playerHQ) {
    // keep HQ anchored to the new edges
    var m = Math.round(38 * L.ui);
    G.playerHQ.x = m;
    G.enemyHQ.x = W - m;
    G.playerHQ.y = L.field.y + L.field.h / 2;
    G.enemyHQ.y = L.field.y + L.field.h / 2;
    G.frontX = clamp(G.frontX, 60, W - 60);
  }
});

resize();
G.playerHQ = { side: "blue", isHQ: true, x: 38, y: 0, hp: HQ_HP, maxHp: HQ_HP, flash: 0 };
G.enemyHQ  = { side: "red",  isHQ: true, x: W - 38, y: 0, hp: HQ_HP, maxHp: HQ_HP, flash: 0 };
G.frontX = W / 2;
G.ink = 10;
requestAnimationFrame(frame);

})();
</script>
